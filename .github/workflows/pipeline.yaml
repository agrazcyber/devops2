name: CI pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: set up node.js
      uses: actions/setup-node@y3
      with:
          node-version:16

    - name: install dependencies
      run: npm install

    - name: Run tests
      run: npm test
